name: CI Audit & Build Verification

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:

jobs:
  audit-and-build:
    name: Production Dependency Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify zero high-severity production vulnerabilities
        run: npm run audit:prod

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js production build
        run: npm run build
