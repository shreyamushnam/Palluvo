<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B878" />
      <stop offset="50%" stop-color="#C5A575" />
      <stop offset="100%" stop-color="#9E7B42" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641C2D" />
      <stop offset="100%" stop-color="#3D1217" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)" />
  
  <!-- Outer Filigree Border -->
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />
  <rect x="36" y="36" width="440" height="440" rx="14" fill="none" stroke="#541920" stroke-width="1" opacity="0.3" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <path d="M 46 64 L 64 64 L 64 46" />
    <path d="M 466 64 L 448 64 L 448 46" />
    <path d="M 46 448 L 64 448 L 64 466" />
    <path d="M 466 448 L 448 448 L 448 466" />
  </g>

  <!-- Emblem / Monogram Medallion -->
  <g transform="translate(256, 195)">
    <!-- Outer decorative ring -->
    <circle r="105" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.7" />
    <circle r="96" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle r="88" fill="none" stroke="#FAF7F2" stroke-width="0.8" opacity="0.4" />

    <!-- Stylized Heritage Loom Saree Weave / Monogram 'P' -->
    <path d="M -28 -50 L 8 -50 C 35 -50 48 -35 48 -14 C 48 8 32 22 8 22 L -10 22 L -10 50 L -28 50 Z M -10 -32 L 6 -32 C 22 -32 30 -24 30 -14 C 30 -4 22 4 6 4 L -10 4 Z" fill="url(#goldGrad)" />
    
    <!-- Delicate Zari accent line -->
    <path d="M -18 -42 L -18 42" stroke="#FAF7F2" stroke-width="1.5" opacity="0.5" />
    <path d="M 8 -22 C 18 -22 22 -18 22 -14 C 22 -10 18 -6 8 -6" fill="none" stroke="#FAF7F2" stroke-width="1.2" opacity="0.6" />

    <!-- Top & Bottom Crown Flourishes -->
    <circle cx="0" cy="-88" r="3.5" fill="url(#goldGrad)" />
    <circle cx="0" cy="88" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: PALLUVO -->
  <text x="256" y="375" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="44" font-weight="700" letter-spacing="9" fill="#3D1217" text-anchor="middle">
    PALLUVO
  </text>

  <!-- Gold Divider -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round">
    <line x1="160" y1="398" x2="230" y2="398" />
    <circle cx="256" cy="398" r="3.5" fill="url(#goldGrad)" />
    <line x1="282" y1="398" x2="352" y2="398" />
  </g>

  <!-- Tagline: LUXURY HERITAGE SAREES -->
  <text x="256" y="426" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#7C5C26" text-anchor="middle">
    HERITAGE WEAVES
  </text>
</svg>